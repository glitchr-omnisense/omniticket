# omnisense/omniticket with every omniticket/* provider:
#
#   docker compose run --rm omniticket test       # every package's tests (recorded answers, no network)
#   docker compose run --rm omniticket bare       # plain PHP: events listed, read, attendees, tickets checked - and what PHP loaded
#   docker compose run --rm omniticket live       # the checks that need no account (Weezevent's public endpoint)
#   docker compose run --rm omniticket phpstan    # PHPStan, each package at the highest level
#   docker compose down -v                        # the harness's volume gone
#
# Providers come from GitHub (branch 1.x) unless their checkout sits under OMNITICKET_PLUGINS (set it
# to ../.. in .env when this core sits in the workspace beside them): then that checkout is what runs.
# omnisense/contracts likewise: its checkout under OMNISENSE_CONTRACTS (../../../omnisense-contracts
# in .env when it sits beside the family's folder), its tests run with the family's; GitHub otherwise.
name: omniticket-harness

services:
  omniticket:
    build: .
    image: omnisense/omniticket-harness
    # The image may be another family's harness tagged (the same PHP 8.4 Alpine with Composer): the
    # entrypoint is named here, not taken from the image.
    entrypoint: ["/omniticket/core/docker/entrypoint.sh"]
    # One service, no server beside it: Docker's default bridge, no network of its own to create.
    network_mode: bridge
    env_file:
      - path: .env
        required: false
    volumes:
      - ..:/omniticket/core
      - ${OMNITICKET_PLUGINS:-./plugins}:/omniticket/plugins:ro
      - ${OMNISENSE_CONTRACTS:-./contracts}:/omnisense/contracts:ro
      - harness:/harness

volumes:
  harness:
